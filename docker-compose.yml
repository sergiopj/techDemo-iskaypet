services:
  app:
    container_name: api
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: animalclinic
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      DB_NAME: animalClinic
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    command: npm start

  postgres:
    image: postgres:16-alpine
    container_name: animal-clinic-postgres
    environment:
      POSTGRES_DB: animalClinic
      POSTGRES_USER: "animalclinic"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # cspell:ignore healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalclinic -d animalClinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
