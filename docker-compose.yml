services:
  app:
    container_name: api
    build: .
    env_file: .env.example
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/animalClinic
      - NODE_ENV=development
      - FRONT_HOST=http://localhost:4200
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    command: sh -c "npm install && npm start"

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: animal-clinic-postgres
    environment:
      POSTGRES_DB: animalClinic
      POSTGRES_USER: "animalclinic"
      POSTGRES_PASSWORD: "localdev"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # cspell:ignore healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalclinic -d animalClinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  postgres-data:
